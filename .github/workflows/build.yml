name: Verify Sendwich
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Validate combined bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'sendwich-bundle'
          ./scripts/stage-zxp.ps1 -OutputDirectory $output
          $files = @(Get-ChildItem -LiteralPath $output -File -Recurse)
          $manifests = @($files | Where-Object Name -eq 'manifest.xml')
          if ($manifests.Count -ne 1) { throw 'Expected one shared manifest' }
          [xml]$manifest = Get-Content -LiteralPath $manifests[0].FullName
          if (@($manifest.ExtensionManifest.ExtensionList.Extension).Count -ne 2) { throw 'Expected both panels' }
          foreach ($node in $manifest.SelectNodes('//MainPath|//ScriptPath|//Icons/Icon')) {
            if (-not (Test-Path -LiteralPath (Join-Path $output $node.InnerText))) { throw "Missing resource: $($node.InnerText)" }
          }
          if (@($files | Where-Object Extension -in @('.p12','.pfx','.pem','.key','.log')).Count) { throw 'Unexpected private or log files' }
          $figma = Get-Content ./SendwichFigma/manifest.json -Raw | ConvertFrom-Json
          foreach ($entry in @($figma.main,$figma.ui)) {
            if (-not (Test-Path -LiteralPath (Join-Path ./SendwichFigma $entry))) { throw "Missing Figma resource: $entry" }
          }
