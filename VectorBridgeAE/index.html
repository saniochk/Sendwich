<html lang="en">
<head>
<meta charset="utf-8">
<title>Sendwich</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="idle">
  <div class="tools">
    <span class="lbl">Shape layers</span>
    <button class="tool" id="btnExplode" type="button" title="Explode: a layer for each group (selected groups, or the top ones). Gradients, blend modes and keyframes are kept">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5" rx="1.2"/><rect x="9.5" y="1.5" width="5" height="5" rx="1.2"/><rect x="1.5" y="9.5" width="5" height="5" rx="1.2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/></svg>
    </button>
    <button class="tool" id="btnMerge" type="button" title="Merge: the selected shape layers into one, each layer becomes a group. Gradients, blend modes and keyframes are kept">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1.3" y="1.3" width="13.4" height="13.4" rx="2" stroke-width="1.15"/>
        <path d="m3.7 3.7 2.4 2.4m-1.5 0h1.5V4.6m6.2-.9L9.9 6.1m0-1.5v1.5h1.5m-7.7 6.2 2.4-2.4m0 1.5V9.9H4.6m7.7 2.4L9.9 9.9m1.5 0H9.9v1.5" stroke-width=".95"/>
      </svg>
    </button>
  </div>
  <div id="pairing" hidden>
    <span id="pairPrompt">Figma wants to connect</span>
    <div><button id="pairAllow" type="button">Allow</button><button id="pairDeny" type="button">Decline</button></div>
  </div>
  <div class="stat ready" id="stat"><span id="sTitle">Ready</span></div>
  <div class="plate"><div class="anim" id="anim"></div><div class="report" id="report" hidden>
    <span><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="9" r="5"/><path d="M6 2h4M8 6.5v3l2 1.2"/></svg><strong id="statTime">0 s</strong></span>
    <span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2 6 3.5L8 9 2 5.5 8 2Zm6 6.5L8 12 2 8.5m12 3L8 15l-6-3.5"/></svg><strong id="statLayers">0</strong> <span id="statLayerLabel">layers</span></span>
    <span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5V3.5h10V5M8 3.5v9m-2.4 0h4.8"/></svg><strong id="statTexts">0</strong> <span id="statTextLabel">text layers</span></span>
    <span><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" stroke-dasharray="2 1.5"/><path d="M8 5.5a2.5 2.5 0 0 1 0 5z"/></svg><strong id="statMasks">0</strong> <span id="statMaskLabel">masks</span></span>
  </div><div class="info" id="info"></div><div class="info idle-hint">Send layers from Figma or Illustrator.</div></div>
</div>
<script src="js/csi-lite.js"></script>
<script src="js/lottie_light.min.js"></script>
<script src="js/anim.js"></script>
<script src="js/main.js"></script>
</body>
</html>
